name: Bug report
description: Something in the app does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security problems: do not use this form**, see SECURITY.md.
        Please do not attach real recordings of private conversations.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Start a recording with the screen locked
        3. ...
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model and Android version
      placeholder: "Samsung Galaxy A54, Android 15"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where did you install the app?
      options:
        - F-Droid
        - GitHub release
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: mic
    attributes:
      label: Microphone
      options:
        - Phone microphone
        - Wired headset
        - USB
        - Bluetooth
        - Not related to recording
  - type: checkboxes
    id: settings
    attributes:
      label: Settings that were on
      options:
        - label: Stereo
        - label: Location
        - label: App lock
        - label: Discreet screen
        - label: Battery optimisation turned off for the app
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: "Output of `adb logcat -d | grep -iE 'Engine|Finisher|witnessclip'` if you can get it."
      render: text
